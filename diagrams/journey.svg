<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img">
  <title>A path you walk at your own pace — L1 to L4</title>
  <desc>A rising dotted path from L1 Standardise (you are here) through L2 Automate, L3 Observe, to L4 Optimise. Every stop is a fine place to stay.</desc>
  <style>text{font-family:Inter,system-ui,sans-serif}.s{font-family:Inter,Georgia,serif;fill:#0F172A}.t{fill:#0F172A}.m{fill:#64748B}</style>
  <text x="380" y="56" text-anchor="middle" class="s" font-size="34" font-weight="600">A path you walk at your own pace</text>
  <text x="380" y="90" text-anchor="middle" class="m" font-size="19">every stop is a fine place to stay</text>

  <path d="M70,360 C220,360 230,300 360,270 C480,242 520,200 690,150"
        fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="2 12"/>

  <circle cx="70" cy="360" r="18" fill="#4F46E5"/>
  <text x="70" y="314" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#4338CA">you are here</text>
  <text x="70" y="402" text-anchor="middle" class="t" font-size="22" font-weight="700">L1 Standardise</text>

  <circle cx="360" cy="270" r="13" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2"/>
  <text x="360" y="312" text-anchor="middle" class="t" font-size="21" font-weight="600">L2 Automate</text>

  <circle cx="520" cy="216" r="13" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2"/>
  <text x="520" y="196" text-anchor="middle" class="t" font-size="21" font-weight="600">L3 Observe</text>

  <circle cx="690" cy="150" r="13" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2"/>
  <text x="690" y="130" text-anchor="middle" class="t" font-size="21" font-weight="600">L4 Optimise</text>

  <text x="380" y="446" text-anchor="middle" class="m" font-size="16">L1 is a complete place to be — many teams run it as-is for a long time.</text>
</svg>
