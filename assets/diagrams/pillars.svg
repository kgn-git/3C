<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Three layers resting on your repo: Standards, Workflow, Quality.">
  <style>text{font-family:Inter,system-ui,sans-serif}.t{fill:#0F172A}.d{fill:#334155}.s{font-family:Inter,Georgia,serif;fill:#0F172A}</style>
  <rect width="460" height="260" rx="18" fill="#F8FAFC"/>
  <text x="230" y="34" text-anchor="middle" class="s" font-size="17">Three layers, resting on your repo</text>
  <g>
    <rect x="70" y="56" width="320" height="46" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
    <circle cx="98" cy="79" r="9" fill="none" stroke="#4F46E5" stroke-width="2.4"/>
    <text x="124" y="76" class="t" font-size="14" font-weight="700">Standards</text>
    <text x="124" y="92" class="d" font-size="11">shared conventions in every AI session</text>
  </g>
  <g>
    <rect x="70" y="110" width="320" height="46" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
    <path d="M90,133 l8,8 l12,-14" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="124" y="130" class="t" font-size="14" font-weight="700">Workflow</text>
    <text x="124" y="146" class="d" font-size="11">the same lifecycle skills on every laptop</text>
  </g>
  <g>
    <rect x="70" y="164" width="320" height="46" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
    <path d="M91,187 a8,8 0 1,1 11,-6" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="124" y="184" class="t" font-size="14" font-weight="700">Quality</text>
    <text x="124" y="200" class="d" font-size="11">gentle pre-commit checks before review</text>
  </g>
  <rect x="70" y="222" width="320" height="14" rx="5" fill="#C7D2FE"/>
  <text x="230" y="251" text-anchor="middle" class="d" font-size="11">your repository</text>
</svg>
