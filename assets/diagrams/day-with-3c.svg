<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" role="img" aria-label="A day with 3C: you ask AI for a change; it already knows your conventions; the hook gently flags anything off; you decide, nothing forced.">
  <style>text{font-family:Inter,system-ui,sans-serif}.t{fill:#0F172A}.m{fill:#64748B}.s{font-family:Inter,Georgia,serif;fill:#0F172A}</style>
  <rect width="700" height="150" rx="18" fill="#F8FAFC"/>
  <text x="350" y="30" text-anchor="middle" class="s" font-size="16">What actually changes in your day — quietly, in the background</text>
  <line x1="80" y1="70" x2="620" y2="70" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="0.5 8"/>
  <g>
    <circle cx="80" cy="70" r="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.4"/>
    <text x="80" y="104" text-anchor="middle" class="t" font-size="12" font-weight="700">You ask AI</text>
    <text x="80" y="120" text-anchor="middle" class="m" font-size="11">for a change</text>
  </g>
  <g>
    <circle cx="260" cy="70" r="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.4"/>
    <text x="260" y="104" text-anchor="middle" class="t" font-size="12" font-weight="700">It already knows</text>
    <text x="260" y="120" text-anchor="middle" class="m" font-size="11">your conventions</text>
  </g>
  <g>
    <circle cx="440" cy="70" r="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.4"/>
    <text x="440" y="104" text-anchor="middle" class="t" font-size="12" font-weight="700">Hook gently flags</text>
    <text x="440" y="120" text-anchor="middle" class="m" font-size="11">anything off</text>
  </g>
  <g>
    <circle cx="620" cy="70" r="10" fill="#4F46E5"/>
    <text x="620" y="104" text-anchor="middle" class="t" font-size="12" font-weight="700">You decide</text>
    <text x="620" y="120" text-anchor="middle" class="m" font-size="11">nothing forced</text>
  </g>
</svg>
