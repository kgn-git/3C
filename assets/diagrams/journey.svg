  <path d="M40,140 C150,138 160,98 260,96 C370,94 360,78 480,74 C550,72 575,66 600,62" fill="none" stroke="#4F46E5" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.5 9"/>
