<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="'Inter','Segoe UI',system-ui,sans-serif">
<title>Where your code goes under 3C: nowhere it didn't already</title>
<desc>The developer workstation is a trust boundary. Source code and the AI assistant both stay inside it — source code never crosses the boundary at any maturity level. At L2 and above, only anonymised metadata (counts, pass/fail, durations — never code, never prompts) optionally flows to a self-hostable backend. Under no maturity level does source code, prompt content, or credentials leave the workstation.</desc>
<rect x="0" y="0" width="760" height="420" fill="#F8FAFC"/>
<rect x="30" y="40" width="430" height="340" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="245" y="68" text-anchor="middle" fill="#312E81" font-size="16" font-weight="700">Developer workstation — trust boundary</text>
<rect x="60" y="92" width="170" height="90" rx="8" fill="#334155"/>
<text x="145" y="132" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Source code</text>
<text x="145" y="154" text-anchor="middle" fill="#E2E8F0" font-size="12">never leaves</text>
<rect x="262" y="92" width="170" height="90" rx="8" fill="#334155"/>
<text x="347" y="132" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">AI assistant</text>
<text x="347" y="154" text-anchor="middle" fill="#E2E8F0" font-size="12">runs locally</text>
<rect x="60" y="210" width="372" height="80" rx="8" fill="#4F46E5"/>
<text x="246" y="244" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">3C governance layer</text>
<text x="246" y="266" text-anchor="middle" fill="#E0E7FF" font-size="12">conventions · gates · local hash-chained log</text>
<rect x="60" y="312" width="372" height="50" rx="8" fill="#10B981"/>
<text x="246" y="342" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Anonymised metadata only (L2+, opt-in)</text>
<path d="M460 337 L560 337" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="510" y="328" text-anchor="middle" fill="#64748B" font-size="11">counts · pass/fail · durations</text>
<rect x="560" y="300" width="170" height="80" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="645" y="332" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Optional backend</text>
<text x="645" y="354" text-anchor="middle" fill="#64748B" font-size="11">self-hostable · L3</text>
<text x="595" y="120" fill="#64748B" font-size="12" font-weight="600">Never crosses:</text>
<text x="595" y="142" fill="#334155" font-size="12">· source code</text>
<text x="595" y="162" fill="#334155" font-size="12">· prompt content</text>
<text x="595" y="182" fill="#334155" font-size="12">· credentials</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>
</svg>
