<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img">
  <title>The L1 gate chain — what runs before a code review</title>
  <desc>L1 ships one PreToolUse hook registered in .claude-plugin/plugin.json. The hook fires four sequential checks before every AI-assisted commit — lint, types, unit tests, secret scan — under a 10-second budget for repos under 500 files. The chain blocks the commit on failure; the escape hatch is /3c-bypass with a logged reason.</desc>
  <style>text{font-family:Inter,system-ui,sans-serif}.t{fill:#0F172A}.d{fill:#334155}.m{fill:#64748B}.s{font-family:Inter,Georgia,serif;fill:#0F172A}.acc{fill:#4F46E5}</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="760" height="360" rx="18" fill="#F8FAFC"/>

  <text x="380" y="40" text-anchor="middle" class="s" font-size="20">The L1 gate chain</text>
  <rect x="330" y="50" width="100" height="3" rx="1.5" fill="#4F46E5"/>
  <text x="380" y="74" text-anchor="middle" class="m" font-size="12">one PreToolUse hook · four sequential checks · &lt;10s budget · blocks on failure</text>

  <rect x="40" y="98" width="160" height="60" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="120" y="124" text-anchor="middle" class="s" font-size="13">PreToolUse hook</text>
  <text x="120" y="144" text-anchor="middle" class="m" font-size="10.5">matcher: Read|Edit|Write</text>

  <path d="M200 128 L246 128" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="246" y="98" width="120" height="60" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="306" y="124" text-anchor="middle" class="s" font-size="13">1 · Lint</text>
  <text x="306" y="144" text-anchor="middle" class="m" font-size="10.5">style + static analysis</text>

  <path d="M366 128 L412 128" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="412" y="98" width="120" height="60" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="472" y="124" text-anchor="middle" class="s" font-size="13">2 · Types</text>
  <text x="472" y="144" text-anchor="middle" class="m" font-size="10.5">tsc / mypy / etc.</text>

  <path d="M532 128 L578 128" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="578" y="98" width="142" height="60" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="649" y="124" text-anchor="middle" class="s" font-size="13">3 · Unit tests</text>
  <text x="649" y="144" text-anchor="middle" class="m" font-size="10.5">touched modules only</text>

  <path d="M649 158 L649 192" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="540" y="192" width="180" height="60" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="630" y="218" text-anchor="middle" class="s" font-size="13">4 · Secret scan</text>
  <text x="630" y="238" text-anchor="middle" class="m" font-size="10.5">AWS keys, tokens, DB URLs</text>

  <path d="M540 222 L490 222" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="280" y="192" width="210" height="60" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="385" y="218" text-anchor="middle" class="s" font-size="13">commit allowed / refused</text>
  <text x="385" y="238" text-anchor="middle" class="m" font-size="10.5">all four pass = commit lands</text>

  <text x="380" y="296" text-anchor="middle" class="acc" font-size="12">all four are advisory-free at L1 — any failure refuses the commit</text>
  <text x="380" y="316" text-anchor="middle" class="m" font-size="11">escape hatch: /3c-bypass --reason="..." (logged, never silent)</text>
  <text x="380" y="338" text-anchor="middle" class="m" font-size="10.5">NFR-PERF-01: chain completes in &lt;10s for repos under 500 files</text>
</svg>
